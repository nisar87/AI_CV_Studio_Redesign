# Firebase App Hosting (Cloud Run) settings — docs/engineering/deployment.md
runConfig:
  cpu: 2
  memoryMiB: 2048 # Chromium needs ~1 GB to render PDFs
  concurrency: 20
  minInstances: 0
  maxInstances: 4 # daily AI budget is shared (Firestore counters); burst limits are per instance, monthly allowances are shared

env:
  # Google Gemini key from Cloud Secret Manager (secret GEMINI_API_KEY). Access granted with
  # `firebase apphosting:secrets:grantaccess GEMINI_API_KEY --backend aicvstudio`. Never put the key here.
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME
  # Gemini is on (owner decision 2026-11-12): CV import uses it (copy-only, verified against the
  # file); AI writing help is Premium-only through the entitlement gate. Set 'off' to pause all AI.
  - variable: AI_PROVIDER
    value: 'gemini'
    availability:
      - RUNTIME
  - variable: AI_MODEL_FAST
    value: gemini-flash-latest
    availability:
      - RUNTIME
  - variable: AI_MODEL_SMART
    value: gemini-flash-latest
    availability:
      - RUNTIME
  - variable: AI_DAILY_BUDGET
    value: '2000'
    availability:
      - RUNTIME
  - variable: RATE_LIMIT_PDF_PER_MINUTE
    value: '10'
    availability:
      - RUNTIME
  # Buyer emails (payment approved/rejected) through Namecheap Private Email — R5 notify/.
  # The mailbox password is the Secret Manager secret SMTP_PASSWORD (set by the owner 2026-11-13).
  - variable: SMTP_USER
    value: 'support@aicvstudio.app'
    availability:
      - RUNTIME
  - variable: SMTP_PASSWORD
    secret: SMTP_PASSWORD
    availability:
      - RUNTIME
