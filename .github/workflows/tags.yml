name: Release tags

# Creates the milestone tags listed in .github/release-tags.txt ("name sha" per line).
# Tags are added here because the build workspace cannot push tag refs directly.
on:
  push:
    branches: [main]
    paths: ['.github/release-tags.txt']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Create missing tags (through the API, so no git pack is needed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while read -r name sha; do
            [ -z "$name" ] && continue
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$name" >/dev/null 2>&1; then
              echo "exists: $name"
            else
              gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$name" -f sha="$sha" >/dev/null
              echo "created: $name → $sha"
            fi
          done < .github/release-tags.txt
