name: CI

on:
  push:
    branches: [main, develop, 'phase-*/**', 'r[0-9]*/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install PDF tools (poppler) for PDF verification tests
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Firestore rules (emulator)
        run: npm run test:rules
      - run: npm run build
        env:
          GEMINI_API_KEY: ci-sentinel-not-a-real-key-123
      - name: No AI key or server AI code in client files
        run: npm run check:secrets
        env:
          GEMINI_API_KEY: ci-sentinel-not-a-real-key-123
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
          # Preview in real Google Chrome (what users run), not Playwright's headless test shell,
          # whose text metrics differ slightly and made preview/PDF page counts disagree.
          PW_BROWSER_PATH: /usr/bin/google-chrome
      - name: Preview/PDF parity against the production PDF renderer (@sparticuz/chromium)
        run: npx playwright test e2e/templates.spec.ts --project=desktop -g parity
        env:
          CI: 'true'
          PW_BROWSER_PATH: /usr/bin/google-chrome
          PDF_BROWSER: bundled
      - name: Template QA (all templates × fixtures → PDF)
        run: npm run qa:templates
        env:
          CHROME_EXECUTABLE_PATH: /usr/bin/google-chrome
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
